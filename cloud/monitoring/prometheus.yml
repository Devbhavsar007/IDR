global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'idr-api'
    metrics_path: '/api/v1/analytics/summary'
    static_configs:
      - targets: ['idr-api:8000']
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
